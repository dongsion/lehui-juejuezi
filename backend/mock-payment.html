<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模拟支付</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pay-card {
      background: #fff;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 360px;
      width: 90%;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .pay-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    .wechat-icon { background: #07C160; color: #fff; }
    .alipay-icon { background: #1677FF; color: #fff; }
    .pay-amount {
      font-size: 32px;
      font-weight: 700;
      color: #333;
      margin: 8px 0 4px;
    }
    .pay-order {
      font-size: 13px;
      color: #999;
      margin-bottom: 24px;
    }
    .pay-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
    }
    .wechat-btn { background: #07C160; }
    .alipay-btn { background: #1677FF; }
    .pay-btn:active { opacity: 0.85; }
    .pay-note {
      font-size: 12px;
      color: #ccc;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="pay-card">
    <div id="payIcon" class="pay-icon wechat-icon">
      <span id="iconText">微信</span>
    </div>
    <div class="pay-amount" id="payAmount">¥0.00</div>
    <div class="pay-order" id="payOrder">订单号：--</div>
    <button class="pay-btn wechat-btn" id="payBtn" onclick="confirmPay()">
      确认支付
    </button>
    <div class="pay-note">这是模拟支付页面，仅用于开发测试</div>
  </div>

  <script>
    // 从 URL 获取参数
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order_id');
    const channel = params.get('channel') || 'wechat';
    const amount = parseFloat(params.get('amount') || '0');

    // 设置显示内容
    document.getElementById('payAmount').textContent = '¥' + amount.toFixed(2);
    document.getElementById('payOrder').textContent = '订单号：' + (orderId || '--');

    const iconEl = document.getElementById('payIcon');
    const btnEl = document.getElementById('payBtn');
    const iconText = document.getElementById('iconText');

    if (channel === 'alipay') {
      iconEl.className = 'pay-icon alipay-icon';
      btnEl.className = 'pay-btn alipay-btn';
      iconText.textContent = '支付宝';
    }

    // 确认支付 → 调用后端回调接口
    function confirmPay() {
      const btn = document.getElementById('payBtn');
      btn.textContent = '支付中...';
      btn.disabled = true;

      const callbackUrl = '/api/payment/callback/' + channel;

      fetch(callbackUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ order_id: orderId }),
      })
        .then((res) => res.json())
        .then((data) => {
          btn.textContent = '支付成功！';
          btn.style.opacity = '0.6';
          // 2 秒后关闭页面（真实支付会跳回商家页面）
          setTimeout(() => {
            window.close();
            // 如果 window.close 不生效（非脚本打开的窗口），显示提示
            btn.textContent = '支付完成，可关闭此页面';
          }, 2000);
        })
        .catch((err) => {
          btn.textContent = '支付失败，请重试';
          btn.disabled = false;
          console.error('支付回调失败:', err);
        });
    }
  </script>
</body>
</html>
